[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archmotion"
version = "2.0.0"
description = "Multi-domain animation engine — fuse architecture, geometry, charts, math & code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "ArchMotion Contributors" },
]
keywords = [
    "animation",
    "architecture",
    "diagram",
    "video",
    "visualization",
    "code-to-video",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "skia-python>=87.0",
    "imageio-ffmpeg>=0.5.1",
    "Pillow>=10.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/archmotion/archmotion"
Documentation = "https://archmotion.github.io/archmotion/"
Repository = "https://github.com/archmotion/archmotion"
Issues = "https://github.com/archmotion/archmotion/issues"
Changelog = "https://github.com/archmotion/archmotion/blob/main/CHANGELOG.md"

[project.scripts]
archmotion = "archmotion.__main__:main"

# ──────────────────────────────────────────────
# Tool Configuration
# ──────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["src/archmotion"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit (security)
    "PT",   # flake8-pytest-style
]
ignore = [
    "D100",   # Missing docstring in public module (handled at class/function level)
    "D104",   # Missing docstring in public package
    "ANN101", # Missing type annotation for `self` (deprecated)
    "ANN102", # Missing type annotation for `cls` (deprecated)
    "S603",   # subprocess call - check for execution of untrusted input (we control FFmpeg)
    "S607",   # Starting a process with a partial executable path
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["archmotion"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",      # No docstrings required in tests
    "ANN",    # No annotations required in tests
    "S101",   # assert is fine in tests
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "skia.*",
    "imageio_ffmpeg.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-v",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring FFmpeg",
]

[tool.coverage.run]
source = ["archmotion"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
