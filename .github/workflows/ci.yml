name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/
      - name: Ruff format check
        run: ruff format --check src/
      - name: Mypy strict type check
        run: mypy src/archmotion --strict --ignore-missing-imports

  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.12" }
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev deps
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit/ -q

  coverage:
    name: Coverage
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/unit/ -q --cov=archmotion --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  package:
    name: Build & Install Wheel
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: python -m pip install dist/*.whl
      - run: python -c "import archmotion; print(archmotion.__version__)"
      - run: archmotion version

  render-smoke:
    name: Real MP4 & PNG Smoke
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: >-
          archmotion render examples/12_mvp_scene.py MvpScene
          -o smoke.mp4 --resolution 320x180 --fps 10 --workers 1
      - run: >-
          archmotion still examples/12_mvp_scene.py MvpScene
          -o smoke.png --resolution 320x180 --fps 10 --time 1.0
      - run: >-
          python -c "from pathlib import Path; from PIL import Image;
          assert Path('smoke.mp4').stat().st_size > 1000;
          assert Image.open('smoke.png').size == (320, 180)"

  studio:
    name: Experimental Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Pyodide wheel payload
        working-directory: .
        run: |
          python -m pip install build hatchling
          python -m build --wheel --no-isolation --outdir studio/public/wheels
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
