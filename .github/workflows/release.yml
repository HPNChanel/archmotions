name: Release to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Trusted Publisher (OIDC — no API token needed)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install -e ".[dev]" build twine
      - name: Verify source gates
        run: |
          ruff check src
          ruff format --check src
          mypy src/archmotion --strict --ignore-missing-imports
          pytest tests/unit -q
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify artifacts and tag
        run: |
          twine check dist/*
          test "v$(python -c 'import archmotion; print(archmotion.__version__)')" = "$GITHUB_REF_NAME"
          python -m venv /tmp/archmotion-release
          /tmp/archmotion-release/bin/pip install dist/*.whl
          /tmp/archmotion-release/bin/archmotion version
      - name: Real render smoke
        run: /tmp/archmotion-release/bin/python benchmarks/_e2e_smoke.py
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
