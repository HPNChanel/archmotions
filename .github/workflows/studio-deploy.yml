name: Deploy Studio

# Builds the archmotion Python wheel (Pyodide payload) + the Studio frontend,
# then deploys to Firebase Hosting (free tier) with COOP/COEP headers enabled
# for multi-threaded ffmpeg.wasm.
#
# Required secret: FIREBASE_SERVICE_ACCOUNT — the JSON of a Firebase service
# account (Firebase console → Project settings → Service accounts → Generate
# new private key). Until it is set, the workflow still builds but skips deploy.

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - "src/archmotion/**"
      - "pyproject.toml"
      - ".github/workflows/studio-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build archmotion wheel for Pyodide
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling
          mkdir -p studio/public/wheels
          python -m build --wheel --no-isolation --outdir studio/public/wheels

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install Studio dependencies
        run: npm ci
        working-directory: studio

      - name: Build Studio
        run: npm run build
        working-directory: studio

      - name: Deploy to Firebase Hosting
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          entryPoint: studio
