name: ✨ Feature Request
description: Suggest a new feature for ArchMotion
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your ideal API / behavior. Code examples welcome.
      render: python

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you've considered.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - "API / DSL (new primitives, animations)"
        - "Rendering Engine (performance, quality)"
        - "Timeline / Choreography"
        - "Output / Export (new formats)"
        - "Tooling / DX (CLI, error messages)"
        - "Other"
